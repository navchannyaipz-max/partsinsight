{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div style="max-width:420px;margin:32px auto">
  <h1 style="font-size:1.6rem">Вхід в адмін-панель</h1>
  <form class="card" method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" required autocomplete="current-password" autofocus>
    <p class="hint">Пароль задається змінною середовища ADMIN_PASSWORD.</p>
    <button class="btn primary" type="submit" style="width:100%;margin-top:12px">Увійти</button>
  </form>
</div>
{% endblock %}
